name: CI Build Tests

on:
  push:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '30 3 * * 0'

permissions:
  contents: read

jobs:
  coverage:
    name: Code Coverage & Memory Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov valgrind

      - name: Create Build Directory
        run: mkdir build

      - name: Configure with Coverage
        run: |
          cd build
          cmake -DENABLE_COVERAGE=1 -DIPV6_PARSE_LIBRARY_ONLY=OFF ..

      - name: Build
        run: |
          cd build
          cmake --build . -j

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Run Extended Tests
        run: |
          cd build
          ./bin/ipv6-test
          ./bin/ipv6-fuzz 100

      - name: Generate Coverage Report
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info
          lcov --ignore-errors unused --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./build/coverage.info
          fail_ci_if_error: false
          verbose: true

      - name: Run Valgrind Memory Check
        run: |
          cd build
          valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes --verbose --error-exitcode=1 --suppressions=../valgrind.supp ./bin/ipv6-test
          valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes --verbose --error-exitcode=1 --suppressions=../valgrind.supp ./bin/ipv6-fuzz 100

  cpp_build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            CC: gcc-12
            CXX: g++-12
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: gcc-12

          - os: ubuntu-latest
            CC: gcc-13
            CXX: g++-13
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: gcc-13

          - os: ubuntu-latest
            CC: gcc-14
            CXX: g++-14
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: gcc-14

          - os: ubuntu-latest
            CC: clang-15
            CXX: clang++-15
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: clang-15

          - os: ubuntu-latest
            CC: clang-16
            CXX: clang++-16
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: clang-16

          - os: ubuntu-latest
            CC: clang-17
            CXX: clang++-17
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: clang-17

          - os: ubuntu-latest
            CC: clang-18
            CXX: clang++-18
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: clang-18

          - os: macos-latest
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: AppleClang

          - os: windows-latest
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: msvc

    name: ${{ matrix.os }}-${{ matrix.NAME }} - C++ Test
    env:
      MSBUILD_PATH: "C:/Program Files (x86)/Microsoft Visual Studio/2019/Enterprise/MSBuild/Current/Bin"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Create Build Directory
        run: mkdir build

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y ${{ matrix.CC }} || echo "Compiler already installed"
          case "${{ matrix.CXX }}" in
            *clang*) ;;
            *) sudo apt install -y ${{ matrix.CXX }} || echo "C++ compiler already installed" ;;
          esac

      - name: Execute CMake Process
        env:
          CC: ${{ matrix.CC }}
          CXX: ${{ matrix.CXX }}
        run: |
          cd build
          ${{ matrix.CMAKE_CMD }}
      - name: Build Project
        run: |
          cd build
          cmake --build . -j --config Release

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure -j -C Release

  test-nodejs:
    name: Node.js Tests and Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Setup npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run dependency security tests
        run: npm run test:security

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest

      - name: Build WASM
        run: ./build_wasm.sh

      - name: Validate build output
        run: npm run validate

      - name: Run Node.js tests
        run: npm run test:node

      - name: Run WASM tests
        run: npm run test:wasm

      - name: Run API tests
        run: npm run test:api

  test-conan:
    name: Conan Package Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Test Conan package
        run: conan create . --build=missing

  dependency-validation:
    name: Dependency and Toolchain Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Setup npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        run: npm ci

      - name: Verify pinned toolchain
        run: npm run test:toolchain

      - name: Verify direct dependencies are current
        run: npm outdated --depth=0

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run dependency security regression tests
        run: npm run test:security
