name: CI Build Tests

on:
  push:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '30 3 * * 0'

jobs:
  cpp_build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            CC: gcc-12
            CXX: g++-12
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: gcc-12

          - os: ubuntu-latest
            CC: gcc-13
            CXX: g++-13
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: gcc-13

          - os: ubuntu-latest
            CC: gcc-14
            CXX: g++-14
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: gcc-14

          - os: ubuntu-latest
            CC: clang-15
            CXX: clang++-15
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: clang-15

          - os: ubuntu-latest
            CC: clang-16
            CXX: clang++-16
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: clang-16

          - os: ubuntu-latest
            CC: clang-17
            CXX: clang++-17
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: clang-17

          - os: ubuntu-latest
            CC: clang-18
            CXX: clang++-18
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: clang-18

          - os: macos-latest
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: AppleClang

          - os: windows-latest
            CMAKE_CMD: cmake .. -DIPV6_PARSE_LIBRARY_ONLY=OFF
            NAME: msvc

    name: ${{ matrix.os }}-${{ matrix.NAME }} - C++ Test
    env:
      MSBUILD_PATH: "C:/Program Files (x86)/Microsoft Visual Studio/2019/Enterprise/MSBuild/Current/Bin"
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
      - name: Create Build Directory
        run: mkdir build

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y ${{ matrix.CC }} || echo "Compiler already installed"
          if [[ "${{ matrix.CXX }}" != *"clang"* ]]; then sudo apt install -y ${{ matrix.CXX }} || echo "C++ compiler already installed"; fi

      - name: Execute CMake Process
        env:
          CC: ${{ matrix.CC }}
          CXX: ${{ matrix.CXX }}
        run: |
          cd build
          ${{ matrix.CMAKE_CMD }}
      - name: Build Project
        run: |
          cd build
          cmake --build . -j --config Release

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure -j -C Release
